version: "3.8"

services:
  database:
    image: mongo:latest
    container_name: tvtime_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: tvtime_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/tvtime

    depends_on:
      - database # Il backend si accende solo dopo che il database è pronto

  frontend:
    build: ./frontend
    container_name: tvtime_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
